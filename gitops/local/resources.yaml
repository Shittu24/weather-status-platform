apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-config
  namespace: weather-dev
data:
  WEATHER_MODE: openmeteo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather
  namespace: weather-dev
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: weather
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: weather
    spec:
      imagePullSecrets:
        - name: ecr-pull
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: weather
          image: 975049996360.dkr.ecr.us-east-1.amazonaws.com/weather-status@sha256:b073578c8d689edbe39c4f49119a126a59e60eaa37a4ae40f56ca359b814b1b1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: weather-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: demo-secret
              mountPath: /var/run/secrets/weather-demo
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: demo-secret
          secret:
            secretName: weather-demo
            defaultMode: 288
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: weather
  namespace: weather-dev
spec:
  selector:
    app: weather
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
